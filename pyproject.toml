[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taobao-user-behavior-analysis"
version = "0.1.0"
description = "Local user behavior data inspection and governance."
requires-python = ">=3.10,<3.13"
dependencies = [
    "duckdb>=1.1,<2.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=16,<21",
    "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "black>=24,<27",
    "isort>=5.13,<8",
    "flake8>=7,<8",
    "pylint>=3,<5",
    "ruff>=0.8,<1",
    "mypy>=1.10,<2",
]

[tool.setuptools]
packages = ["taobao_user_behavior"]
package-dir = {taobao_user_behavior = "src/taobao_user_behavior"}

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ISC001", "ISC002"]

[tool.ruff.lint.flake8-implicit-str-concat]
allow-multiline = false

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
# 分块清洗保留具名中间变量，便于检查每一步结果。
max-locals = 25
# 配置类集中保存运行参数。
max-attributes = 16

[tool.pylint.main]
py-version = "3.10"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
