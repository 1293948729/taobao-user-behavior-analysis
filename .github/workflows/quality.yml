name: Python quality

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      TAOBAO_CJK_FONT: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Chinese font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-wqy-zenhei
          test -f "$TAOBAO_CJK_FONT"
      - name: Install project and development tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -e ".[dev]"
      - name: Verify Chinese font
        run: |
          python - <<'PY'
          from taobao_user_behavior.visualization.style import (
              configure_charts,
              find_chinese_font,
          )

          configure_charts()
          print(f"Chinese font: {find_chinese_font()}")
          PY
      - name: Run quality checks
        run: python scripts/check_project.py
      - name: Check additional coding rules
        run: python scripts/verify_coding_standard.py
